<style>

</style></head><body>
<div id="stage"></div><div id="cap"></div>
<div id="hud"><div id="sub">Pulsa «Activar cámara» y apunta al marcador Hiro.</div>
<button id="go">📷 Activar cámara</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/three.js/build/ar-threex.js"></script>
<script>
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setClearColor(0x000000,0);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
Object.assign(renderer.domElement.style,{position:'absolute',top:'0',left:'0',zIndex:'5'});
const stage=document.getElementById('stage');stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.Camera();scene.add(camera);
const root=new THREE.Group();root.visible=false;scene.add(root);
root.add(new THREE.HemisphereLight(0xcfe0ff,0x2a2f4a,.9));
const kl=new THREE.DirectionalLight(0xffffff,1.3);kl.position.set(1,3,2);root.add(kl);root.add(kl.target);
const pb=new THREE.PointLight(0x4f8bff,2.5,2.4),po=new THREE.PointLight(0xff8a5c,2,2.4);root.add(pb,po);
const S=new THREE.Group();S.scale.setScalar(.11);root.add(S);
const MT=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.45,metalness:.1},o||{}));
function RB(w,h,d,r){const g=new THREE.BoxGeometry(w,h,d,4,4,4),p=g.attributes.position,v=new THREE.Vector3(),c=new THREE.Vector3(),hw=w/2-r,hh=h/2-r,hd=d/2-r;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);c.set(Math.max(-hw,Math.min(hw,v.x)),Math.max(-hh,Math.min(hh,v.y)),Math.max(-hd,Math.min(hd,v.z)));v.sub(c).setLength(r).add(c);p.setXYZ(i,v.x,v.y,v.z)}g.computeVertexNormals();return g}
const tex=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=8;return t};
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
const lab=(t,col,s)=>{const m=tex(640,140,(x,w,h)=>{rr(x,6,6,w-12,h-12,34);x.fillStyle='rgba(8,14,40,.8)';x.fill();x.lineWidth=4;x.strokeStyle=col;x.stroke();x.fillStyle='#fff';x.font='bold 56px system-ui,Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(t,w/2,h/2+3)});const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:m,transparent:true,depthWrite:false}));sp.scale.set(s*640/140,s,1);return sp};
const glow=(col,s)=>{const m=tex(128,128,x=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128)});const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:m,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));sp.scale.set(s,s,1);return sp};
const drawCard=(title,rows,acc)=>(x,w,h)=>{x.fillStyle='#10183a';x.fillRect(0,0,w,h);x.fillStyle=acc;x.fillRect(0,0,w,h*.17);x.fillStyle='#fff';x.font='bold '+h*.1+'px system-ui,Arial';x.textAlign='left';x.textBaseline='middle';x.fillText(title,w*.05,h*.085);x.font=h*.09+'px system-ui,Arial';rows.forEach((r,i)=>{x.fillStyle='rgba(255,255,255,.92)';x.fillText(r,w*.07,h*(.34+i*.22))})};
const card=(w,h,f)=>{const e=MT(0x1b2450);return new THREE.Mesh(RB(w,h,.07,.025),[e,e,e,e,new THREE.MeshStandardMaterial({map:tex(512,Math.round(512*h/w),f),roughness:.5}),e])};
function tile(l,c){const f=tex(256,256,(x,w,h)=>{x.fillStyle=c;x.fillRect(0,0,w,h);x.fillStyle='rgba(255,255,255,.14)';x.fillRect(0,0,w,h/2);x.fillStyle='#fff';x.font='bold 150px system-ui,Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(l,w/2,h/2+8)});const m=MT(c,{roughness:.4}),mf=new THREE.MeshStandardMaterial({map:f,roughness:.35,metalness:.1});return new THREE.Mesh(RB(1.3,1.3,.34,.12),[m,m,m,m,mf,m])}

const disc=new THREE.Mesh(new THREE.CircleGeometry(5,64),new THREE.MeshStandardMaterial({color:0x0c1230,roughness:.4,metalness:.6}));disc.rotation.x=-Math.PI/2;disc.position.y=.01;S.add(disc);
const edge=new THREE.Mesh(new THREE.RingGeometry(4.9,5.05,64),new THREE.MeshBasicMaterial({color:0x4f8bff}));edge.rotation.x=-Math.PI/2;edge.position.y=.02;S.add(edge);
const NM=90,mp=new Float32Array(NM*3);for(let i=0;i<NM;i++){mp[i*3]=(Math.random()-.5)*10;mp[i*3+1]=Math.random()*6;mp[i*3+2]=(Math.random()-.5)*7}
const mg=new THREE.BufferGeometry();mg.setAttribute('position',new THREE.BufferAttribute(mp,3));const motes=new THREE.Points(mg,new THREE.PointsMaterial({color:0xaec4ff,size:.012,transparent:true,opacity:.8,depthWrite:false}));S.add(motes);
// orbe Copilot
const orb=new THREE.Group();S.add(orb);
orb.add(new THREE.Mesh(new THREE.SphereGeometry(.62,48,32),MT(0xffffff,{emissive:0x5a8cff,emissiveIntensity:1.4,roughness:.2})));
const rings=[0x4f8bff,0xb36bff,0xff8a5c].map((c,i)=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.95+i*.12,.045,16,96),MT(c,{emissive:c,emissiveIntensity:1.1}));r.rotation.set(i*1.1,i*.7,0);orb.add(r);return r});
orb.add(glow('rgba(110,150,255,.8)',5));

// props por escena
const P=[];
const add=fn=>{const g=new THREE.Group();g.visible=false;S.add(g);P.push({g,tick:fn(g)||(()=>{}),s:0})};
const cl01=(a)=>Math.min(1,Math.max(0,a)),ez=k=>1-Math.pow(1-k,3),sm=k=>k*k*(3-2*k);
add(g=>{});
add(g=>{const a=card(2.4,1.4,drawCard('Tu petición',['“Resume este','documento”'],'#4f8bff')),b=card(2.4,1.4,drawCard('Resultado',['✓ Resumen listo','✓ Puntos clave'],'#ff8a5c'));a.position.set(-3.6,1.6,0);b.position.set(3.6,1.6,0);g.add(a,b);
  [['1 Tú pides',-3.6],['2 Copilot entiende',0],['3 Tu resultado',3.6]].forEach(([t,x])=>{const l=lab(t,'#6aa2ff',.5);l.position.set(x,.45,.3);g.add(l)});
  const ps=[];for(let i=0;i<14;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.08,12,8),MT(0xffffff,{emissive:i%2?0x4f8bff:0xff8a5c,emissiveIntensity:2}));g.add(m);ps.push(m)}
  return(u,t)=>ps.forEach((m,i)=>{const k=(t*.35+i/14)%1;m.position.set(-2.4+k*4.8,1.6+Math.sin(k*6.283+i)*.25,.2)})});
add(g=>{const tl=tile('W','#2b579a');g.add(tl);const sh=new THREE.Mesh(RB(2.5,3.2,.08,.03),MT(0xf4f6ff,{roughness:.9}));sh.position.set(.4,1.8,0);sh.rotation.y=-.18;g.add(sh);
  const ls=[];for(let i=0;i<8;i++){const geo=new THREE.BoxGeometry(1,.09,.03);geo.translate(.5,0,0);const m=new THREE.Mesh(geo,MT(i?0x9aa6c8:0x2b579a));m.position.set(-.95,1.2-i*.32,.05);m.userData.w=i?1.2+((i*37)%7)/10:1.6;sh.add(m);ls.push(m)}
  return(u,t)=>{tl.position.set(-2.4,3.1+Math.sin(t*1.6)*.1,.2);tl.rotation.y=Math.sin(t*.8)*.3;ls.forEach((m,i)=>{m.scale.x=Math.max(.001,m.userData.w*cl01((u*1.5-i*.11)*3))})}});
add(g=>{const tl=tile('X','#217346');g.add(tl);const base=new THREE.Mesh(RB(4.4,.16,2,.05),MT(0x141c44));base.position.set(.4,.1,0);g.add(base);
  const H=[1,1.7,1.3,2.4,2,3],bs=H.map((h,i)=>{const geo=new THREE.BoxGeometry(.5,1,.5);geo.translate(0,.5,0);const m=new THREE.Mesh(geo,MT(new THREE.Color().setHSL(.4-i*.015,.7,.45),{emissive:0x0a3a22,emissiveIntensity:.6}));m.position.set(-1.35+i*.75,.18,0);g.add(m);return m});
  return(u,t)=>{tl.position.set(-2.8,3.1+Math.sin(t*1.6)*.1,.2);tl.rotation.y=Math.sin(t*.8)*.3;bs.forEach((m,i)=>{m.scale.y=Math.max(.001,H[i]*ez(cl01(u*1.6-i*.13)))})}});
add(g=>{const tl=tile('P','#d24726');g.add(tl);const cs=[['Resumen','#d24726'],['Ideas clave','#ff8a5c'],['Próximos pasos','#b36bff']].map(([n,c])=>{const m=card(2.6,1.5,drawCard(n,['• Punto principal','• Dato clave'],c));g.add(m);return m});
  return(u,t)=>{tl.position.set(-3,3.1+Math.sin(t*1.6)*.1,.2);tl.rotation.y=Math.sin(t*.8)*.3;cs.forEach((m,i)=>{const k=ez(cl01(u*1.8-i*.25));m.position.set((i-1)*2.2,1.5+(i%2)*.25+Math.sin(t*1.4+i)*.05,-i*.15);m.rotation.y=(1-k)*1.4-(i-1)*.12;m.scale.setScalar(Math.max(.001,k))})}});
add(g=>{const tl=tile('O','#0f6cbd');g.add(tl);const sc=card(2.8,1.7,drawCard('Resumen del hilo',['✓ 3 decisiones','✓ 2 pendientes'],'#0f6cbd'));sc.position.set(.4,1.7,0);g.add(sc);
  const ev=[];for(let i=0;i<6;i++){const m=new THREE.Mesh(RB(1.1,.72,.1,.04),MT(0xe8efff,{roughness:.7}));g.add(m);m.userData.p=[(i%3-1)*1.6+.4,1.1+Math.floor(i/3)*1.4,(i%2)*.5-.25];ev.push(m)}
  return(u,t)=>{const e=sm(cl01((u-.3)*2.2));tl.position.set(-3,3.1+Math.sin(t*1.6)*.1,.2);tl.rotation.y=Math.sin(t*.8)*.3;ev.forEach((m,i)=>{const p=m.userData.p;m.position.set(p[0]+(.4-p[0])*e,p[1]+(1.7-p[1])*e+Math.sin(t*1.5+i)*.06*(1-e),p[2]*(1-e));m.rotation.z=Math.sin(i*2)*.3*(1-e);m.scale.setScalar(Math.max(.001,1-e*.95))});sc.scale.setScalar(Math.max(.001,e))}});
add(g=>{const tl=tile('T','#5b5fc7');g.add(tl);const sc=card(2.8,1.7,drawCard('Reunión resumida',['✓ Acuerdos','✓ Tareas y dueños'],'#5b5fc7'));sc.position.set(.4,1.7,0);g.add(sc);
  const bs=[0xb36bff,0x4f8bff,0xff8a5c,0x2ee6a6,0xffd166].map(c=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.38,24,16),MT(c,{emissive:c,emissiveIntensity:.5}));g.add(m);return m});
  return(u,t)=>{const e=sm(cl01((u-.35)*2.2)),s=Math.max(.001,1-e);tl.position.set(-3,3.1+Math.sin(t*1.6)*.1,.2);tl.rotation.y=Math.sin(t*.8)*.3;bs.forEach((m,i)=>{const a=t*.8+i*1.26;m.position.set(.4+Math.cos(a)*2.2*(1-e),1.7+Math.sin(a*1.3)*.9*(1-e),Math.sin(a)*1.2*(1-e));m.scale.set(1.4*s,.95*s,.7*s)});sc.scale.setScalar(Math.max(.001,e))}});
add(g=>{const it=[['Copilot Chat','Para tus consultas','#4f8bff'],['Microsoft 365 Copilot','Dentro de tus apps','#2b579a'],['Copilot Studio','Tus propios agentes','#b36bff'],['GitHub Copilot','Para programar','#1fae82']];
  const cs=it.map(([a,b,c],i)=>{const m=card(2.4,1.4,drawCard(a,[b],c));g.add(m);return m});
  return(u,t)=>cs.forEach((m,i)=>{const k=ez(cl01(u*2-i*.2));m.scale.setScalar(Math.max(.001,k));m.position.set(i%2?1.4:-1.4,(i<2?2.6:1)+Math.sin(t*1.3+i)*.07,0);m.rotation.y=Math.sin(t*.7+i)*.12})});
add(g=>{const T=[['Sé claro','#4f8bff',1.2],['Da contexto','#b36bff',1.9],['Revisa siempre','#ff8a5c',2.6]];
  const ps=T.map(([n,c,h],i)=>{const geo=new THREE.CylinderGeometry(.6,.6,1,32);geo.translate(0,.5,0);const m=new THREE.Mesh(geo,MT(c,{emissive:c,emissiveIntensity:.35}));m.position.set((i-1)*1.9,0,0);g.add(m);const l=lab(n,c,.5);g.add(l);return[m,l,h]});
  return(u,t)=>ps.forEach(([m,l,h],i)=>{const k=ez(cl01(u*1.8-i*.25));m.scale.y=Math.max(.001,h*k);l.position.set(m.position.x,h*k+.6,0)})});
add(g=>{const tl=[['W','#2b579a'],['X','#217346'],['P','#d24726'],['O','#0f6cbd'],['T','#5b5fc7']].map(([l,c])=>{const m=tile(l,c);m.scale.setScalar(.8);g.add(m);return m});
  return(u,t)=>tl.forEach((m,i)=>{const a=t*.5+i*1.2566;m.position.set(Math.cos(a)*3.2,1.6+Math.sin(t+i)*.15,Math.sin(a)*3.2);m.rotation.y=-a+1.5708})});

// guion
const SC=[
{h:'Microsoft Copilot',cam:[0,2.2,9],orb:[0,1.8,0,1.6],n:'Microsoft Copilot es un asistente de inteligencia artificial que te ayuda a trabajar más rápido, directamente en las herramientas que ya usas.'},
{h:'Cómo funciona',cam:[0,2.6,10],orb:[0,1.6,0,.9],n:'Funciona así: tú le pides algo con tus propias palabras, Copilot lo entiende con inteligencia artificial, lo combina con el contexto de tu trabajo y te devuelve un resultado listo para usar.'},
{h:'Word',cam:[3.5,3.4,8.5],orb:[2.6,3.2,.6,.55],n:'En Word te ayuda a redactar, reescribir y resumir documentos.'},
{h:'Excel',cam:[-3.5,3.6,8.5],orb:[2.8,3.2,.5,.55],n:'En Excel analiza tus datos, sugiere fórmulas y crea gráficos.'},
{h:'PowerPoint',cam:[0,3.2,8.5],orb:[3.4,3.4,.5,.55],n:'En PowerPoint convierte un documento o una idea en una presentación.'},
{h:'Outlook',cam:[3.5,3.4,8.5],orb:[3.2,3.2,.5,.55],n:'En Outlook resume hilos largos de correo y te ayuda a redactar respuestas.'},
{h:'Teams',cam:[-3.4,3.4,8.5],orb:[3.2,3.2,.5,.55],n:'En Teams resume reuniones y destaca los acuerdos y las tareas pendientes.'},
{h:'La familia Copilot',cam:[0,3,9],orb:[0,4.4,-.5,.7],n:'Además hay un chat para tus consultas, Copilot Studio para crear tus propios agentes, y GitHub Copilot para programar.'},
{h:'Buenas prácticas',cam:[-3,3,9],orb:[3,3.2,0,.6],n:'Para sacarle provecho, pide con claridad, da contexto y revisa siempre el resultado: tú tienes el control.'},
{h:'Empieza hoy',cam:[0,2.8,10],orb:[0,1.6,0,1.1],n:'Empieza con una tarea pequeña y deja que Copilot se encargue del trabajo repetitivo.'}];

const cap=document.getElementById('cap'),txt=document.getElementById('sub'),go=document.getElementById('go'),lk=document.getElementById('lk');
let cur=-1,st=0,dur=5,tok=0,speaking=false,vl=[],src=null,ctx=null,armed=false;
function loadV(){const a=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('es'));if(a.length)vl=a}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=loadV;loadV()}
function showScene(i){
  const t0=++tok;cur=i;st=clk.elapsedTime;const s=SC[i];dur=Math.max(5,s.n.length*.068);
  cap.textContent=s.h;txt.textContent=s.n;speaking=true;
  let done=false;const next=()=>{if(done||t0!==tok)return;done=true;speaking=false;setTimeout(()=>{if(t0!==tok)return;i+1<SC.length?showScene(i+1):finish()},700)};
  if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s.n);u.lang='es-ES';if(vl.length){u.voice=vl[0];u.lang=vl[0].lang}u.rate=.97;u.onend=next;speechSynthesis.speak(u);setTimeout(next,dur*1000+5000)}
  else setTimeout(next,dur*1000);
}
function finish(){cap.style.display='none';txt.textContent='Microsoft Copilot: tú pides, Copilot ayuda, tú decides.';go.textContent='↻ Ver de nuevo';go.style.display='block';cur=-1}
function onResize(){if(!src)return;fixDom();src.onResizeElement();src.copyElementSizeTo(renderer.domElement);if(ctx&&ctx.arController!==null)src.copyElementSizeTo(ctx.arController.canvas)}
addEventListener('resize',onResize);addEventListener('orientationchange',()=>setTimeout(onResize,400));
function fixDom(){
  if(src&&src.domElement&&src.domElement.parentNode!==stage)stage.appendChild(src.domElement);
  document.querySelectorAll('canvas').forEach(c=>{if(c!==renderer.domElement)c.style.display='none'});
}
function fit(){let n=0;onResize();const iv=setInterval(()=>{onResize();if(++n>40)clearInterval(iv)},500)}
if(window.visualViewport)visualViewport.addEventListener('resize',onResize);
function initAR(){
  src=new THREEx.ArToolkitSource({sourceType:'webcam'});
  src.init(fit,()=>{txt.textContent='No se pudo abrir la cámara. Revisa el permiso y que la página use https.';go.style.display='block';armed=false});
  fixDom();
  if(src.domElement)['loadedmetadata','loadeddata','playing','resize'].forEach(e=>src.domElement.addEventListener(e,onResize));
  ctx=new THREEx.ArToolkitContext({cameraParametersUrl:'https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/data/data/camera_para.dat',detectionMode:'mono'});
  ctx.init(()=>camera.projectionMatrix.copy(ctx.getProjectionMatrix()));
  new THREEx.ArMarkerControls(ctx,root,{type:'pattern',patternUrl:'https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/data/data/patt.hiro',smooth:true,smoothCount:5,smoothTolerance:.01,smoothThreshold:2});
  armed=true;
}

go.onclick=()=>{
  go.style.display='none';lk.style.display='none';
  if(src){armed=true;txt.textContent='Apunta al marcador…';return}
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}
  txt.textContent='Abriendo cámara… apunta al marcador Hiro.';initAR();
};
const clk=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
  if(src&&src.ready&&ctx)ctx.update(src.domElement);
  if(armed&&root.visible){armed=false;cap.style.display='block';setTimeout(()=>showScene(0),600)}
  const s=SC[Math.max(cur,0)],ok=1-Math.exp(-dt*2.2),o=s.orb,pu=speaking&&cur>=0?1+.05*Math.sin(t*12):1;
  orb.position.x+=(o[0]-orb.position.x)*ok;orb.position.y+=(o[1]+Math.sin(t*1.4)*.12-orb.position.y)*ok;orb.position.z+=(o[2]-orb.position.z)*ok;
  orb.scale.setScalar(orb.scale.x+(o[3]*pu-orb.scale.x)*ok);
  rings.forEach((r,i)=>{r.rotation.x+=dt*(.6+i*.3);r.rotation.y+=dt*(.4+i*.25)});
  pb.position.set((orb.position.x+3)*.11,(orb.position.y+2)*.11,(orb.position.z+3)*.11);po.position.set((orb.position.x-3)*.11,(orb.position.y+1)*.11,(orb.position.z+2)*.11);
  P.forEach((p,i)=>{const on=i===cur;p.s+=((on?1:0)-p.s)*(1-Math.exp(-dt*5));p.g.visible=p.s>.01;p.g.scale.setScalar(Math.max(.001,p.s));if(p.g.visible)p.tick(cl01((t-st)/dur),t)});
  motes.rotation.y=t*.03;renderer.render(scene,camera)})();
</script></body></html>
